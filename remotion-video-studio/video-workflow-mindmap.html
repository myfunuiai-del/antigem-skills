<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero-Redundancy 4-Directional Video Studio Mind-Map</title>
  <link rel="stylesheet" href="./dependency-modal.css" />
  <style>
    @font-face {
      font-family: 'HindSiliguriFixed';
      src: url('./fonts/HindSiliguriFixed-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'HindSiliguriFixed';
      src: url('./fonts/HindSiliguriFixed-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'HindSiliguriFixed';
      src: url('./fonts/HindSiliguriFixed-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'HindSiliguriFixed';
      src: url('./fonts/HindSiliguriFixed-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    :root {
      --bg: #0e1014;
      --surface: #15181f;
      --surface-2: #1d212b;
      --border: #2c3240;
      --border-opt: #3f485c;
      --text: #eef0f4;
      --muted: #8a92a1;
      --accent: #e5a93c;
      --accent-dim: rgba(229, 169, 60, 0.14);
      --opt-color: #7dd3fc;
      --opt-dim: rgba(125, 211, 252, 0.12);
      --line: #303746;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'HindSiliguriFixed', system-ui, -apple-system, sans-serif;
      padding: 14px;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .header-top h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .prompt-make-btn {
      background: linear-gradient(135deg, #e5a93c 0%, #d97706 100%);
      color: #0b0d12;
      font-weight: 700;
      font-size: 0.82rem;
      border: none;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(229, 169, 60, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }
    .prompt-make-btn:active {
      transform: scale(0.97);
    }
    .header-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .header-nav::-webkit-scrollbar {
      display: none;
    }
    .nav-chip {
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid transparent;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .nav-chip:hover {
      opacity: 0.88;
    }

    .canvas-legend {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(14, 16, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--muted);
      pointer-events: none;
    }
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .legend::-webkit-scrollbar {
      display: none;
    }
    .legend .dep-open-btn {
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.76rem;
      padding: 6px 10px;
    }

    @media (max-width: 680px) {
      body {
        padding: 8px 6px;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      header h1 {
        font-size: 0.95rem;
        text-align: center;
      }
      .legend {
        justify-content: flex-start;
      }
      .canvas-card {
        height: 380px;
      }
      .inspector {
        padding: 12px 14px;
      }
      .ins-head h3 {
        font-size: 0.95rem;
      }
      .prompt-text {
        font-size: 0.78rem;
      }
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .swatch {
      width: 14px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }
    .swatch.core {
      background: var(--surface-2);
      border: 1.5px solid var(--accent);
    }
    .swatch.opt {
      background: #141720;
      border: 1.5px dashed var(--opt-color);
    }

    /* Large 4-Directional Canvas Card */
    .canvas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      height: 470px;
      background-image: radial-gradient(#252a36 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
    }
    .canvas-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .canvas-viewport:active {
      cursor: grabbing;
    }
    .reset-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(21, 24, 31, 0.94);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .canvas-stage {
      position: relative;
      width: 1480px;
      height: 860px;
      transform-origin: 0 0;
    }
    .wing-label {
      position: absolute;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      pointer-events: none;
    }
    svg.links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .link-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.9;
      transition: stroke 0.18s ease, stroke-width 0.18s ease;
    }
    .link-path.opt-line {
      stroke-dasharray: 5 5;
    }
    .link-path.active {
      stroke: var(--accent);
      stroke-width: 2.6;
      stroke-dasharray: none;
    }
    .link-path.opt-line.active {
      stroke: var(--opt-color);
    }

    .t-node {
      position: absolute;
      background: var(--surface-2);
      border: 1.3px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .t-node:hover {
      border-color: #556078;
    }
    .t-node.optional {
      background: #141720;
      border-style: dashed;
      border-color: var(--border-opt);
    }
    .t-node.active {
      border-color: var(--accent);
      border-style: solid;
      background: #232834;
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .t-node.optional.active {
      border-color: var(--opt-color);
      box-shadow: 0 0 0 2px var(--opt-dim);
    }
    .t-node.root {
      background: #1a1f2a;
      border: 1.6px solid var(--accent);
      text-align: center;
      padding: 12px;
      cursor: default;
    }
    .t-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .t-title {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt-pill {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--opt-color);
      background: var(--opt-dim);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .t-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Inspector Card */
    .inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .ins-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .ins-head h3 {
      font-size: 1rem;
      font-weight: 700;
    }
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.72rem;
      font-family: monospace;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .tag.role {
      background: #232834;
      color: #cbd5e1;
      font-family: inherit;
    }
    .tag.opt {
      background: var(--opt-dim);
      color: var(--opt-color);
      font-family: inherit;
    }
    .inspector ul {
      padding-left: 18px;
      font-size: 0.86rem;
      color: #c8cdd6;
      margin-bottom: 12px;
    }
    .inspector li { margin-bottom: 5px; }
    .prompt-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
    }
    .prompt-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }
    .prompt-label {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
    }
    .copy-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .prompt-text {
      font-size: 0.84rem;
      color: var(--text);
      line-height: 1.58;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-top">
        <h1>মাস্টার ভিডিও স্টুডিও মাইন্ড-ম্যাপ</h1>
        <button type="button" class="prompt-make-btn" id="openDepModalBtn">⚡ Prompt Make</button>
      </div>
      <div class="header-nav">
        <a href="./style-preview.html" class="nav-chip" style="background:#1a2534;color:#f5d078;border-color:rgba(245,208,120,0.38);">🎬 স্টাইল প্রিভিউ</a>
        <a href="./rig-preview.html" class="nav-chip" style="background:#132536;color:#7dd3fc;border-color:rgba(76,201,240,0.4);">🦴 রিগ প্রিভিউ</a>
        <a href="./modules-preview.html" class="nav-chip" style="background:#201435;color:#e879f9;border-color:rgba(232,121,249,0.4);">✨ মোশন লজিক</a>
        <a href="./system-readiness.html" class="nav-chip" style="background:#064e3b;color:#34d399;border-color:rgba(52,211,153,0.4);">🛡️ সিস্টেম অডিট</a>
      </div>
    </header>

    <div class="canvas-card">
      <div class="canvas-legend">
        <span class="legend-item"><span class="swatch core"></span> Core</span>
        <span class="legend-item"><span class="swatch opt"></span> Optional</span>
      </div>
      <button class="reset-btn" onclick="resetCanvas()">Reset</button>
      <div class="canvas-viewport" id="viewport">
        <div class="canvas-stage" id="stage">
          <div class="wing-label" style="left: 590px; top: 18px;">▲ চ্যানেল ফাউন্ডেশন (Optional / একবার সেটআপ)</div>
          <div class="wing-label" style="left: 335px; top: 205px;">◀ প্রি-প্রোডাকশন (ধাপ ১–৪)</div>
          <div class="wing-label" style="left: 890px; top: 205px;">প্রোডাকশন, রেন্ডার ও ভাইরাল (ধাপ ৫–৮) ▶</div>
          <div class="wing-label" style="left: 555px; top: 825px;">▼ পোস্ট-পাবলিশ গ্রোথ ও অডিট লুপ (Optional / আপলোডের পর)</div>
          <svg class="links" id="linksSvg" viewBox="0 0 1480 860"></svg>
          <div id="nodesLayer"></div>
        </div>
      </div>
    </div>

    <div class="inspector" id="inspector"></div>
  </div>

  <script>
    // Consolidated Zero-Loss Architecture: Every single skill & technical guard preserved inside unified prompts!
    const wings = {
      top: {
        id: 'strat',
        title: '০. চ্যানেল ফাউন্ডেশন',
        sub: 'voice.md + yt-plan',
        role: 'Channel Architect',
        tool: 'voice.md + yt-plan',
        optional: true,
        x: 615, y: 162, w: 250, h: 52,
        points: [
          'একবার চ্যানেলের ভয়েস স্টাইল (voice.md) ও সাপ্তাহিক ক্যালেন্ডার (yt-plan) সেটআপ করার জন্য—প্রতি ভিডিওতে করতে হয় না।',
          'একবার সেট করলে বাকি সব ১১টি yt-* স্কিল আপনার নিজের টোনে কাজ করে।'
        ],
        prompt: 'আমার YouTube চ্যানেলের ফাউন্ডেশন সেটআপ করো। আগে অপশন দিয়ে ফোর্স করে জেনে নাও আমি কি voice.md (আমার বলার ধরন লক) করব, নাকি yt-plan দিয়ে মাসিক কনটেন্ট ক্যালেন্ডার (১টি Anchor Long + ৩টি Shorts) বানাব।',
        children: [
          {
            id: 'strat_voice',
            title: '০.১ ভয়েস প্রোফাইল (voice.md)',
            sub: '~/.gemini/config/youtube/voice.md',
            role: 'Brand Director',
            tool: 'voice.md',
            optional: true,
            x: 425, y: 50, w: 295, h: 56,
            points: [
              'আপনার ২–৩টি প্রিয়/নিজের ভিডিওর বলার ধরন বিশ্লেষণ করে voice.md পূরণ করে।',
              'এরপর সব yt-* স্কিল হুবহু আপনার নিজস্ব টোন ও শব্দচয়ন ফলো করে।'
            ],
            prompt: 'আমার দেওয়া ২–৩টি স্যাম্পল স্ক্রিপ্ট বা ভিডিওর ধরন বিশ্লেষণ করে ~/.gemini/config/youtube/voice.md আপডেট করো। আগে অপশন দিয়ে জেনে নাও আমার টোন কেমন (গম্ভীর ডকুমেন্টারি / বন্ধুভাবাপন্ন গল্পকার / ফাস্ট ফ্যাক্টস / ব্যঙ্গাত্মক), পছন্দের শব্দ এবং কোন ক্লিশে কথা বাদ দিতে হবে।'
          },
          {
            id: 'strat_plan',
            title: '০.২ কনটেন্ট ক্যালেন্ডার (yt-plan)',
            sub: '১টি Anchor Long + ৩টি Shorts ব্যাচ প্ল্যান',
            role: 'Content Producer',
            tool: 'yt-plan',
            optional: true,
            x: 760, y: 50, w: 295, h: 56,
            points: [
              'আপনার সাপ্তাহিক ফ্রি সময় অনুযায়ী বার্নআউট ছাড়া আপলোড ক্যালেন্ডার ও সিরিজ প্ল্যান বানায়।'
            ],
            prompt: 'yt-plan স্কিল ব্যবহার করে আগামী ১ মাসের কনটেন্ট ক্যালেন্ডার বানাও। আগে অপশন দিয়ে জেনে নাও: ১) সপ্তাহে কত ঘণ্টা কাজ করতে পারব, ২) লং + Shorts অনুপাত কী চাই, এবং ৩) কোন ৩টি সিরিজ চালাব।'
          }
        ]
      },

      bottom: {
        id: 'growth',
        title: '৯. পোস্ট-পাবলিশ গ্রোথ লুপ',
        sub: 'yt-comment + retention.py + yt-audit',
        role: 'Growth Director',
        tool: 'yt-retention + yt-audit',
        optional: true,
        x: 615, y: 642, w: 250, h: 52,
        points: [
          'আপলোডের পর কমেন্ট ট্রায়াজ, ৪৮-ঘণ্টার রিটেনশন ফরেনসিকস ও মাসিক চ্যানেল অডিট—যার ডেটা পরের ভিডিওকে দ্বিগুণ শক্তিশালী করে।'
        ],
        prompt: 'আমার আপলোড করা ভিডিওর পারফরম্যান্স বিশ্লেষণ করো। আগে অপশন দিয়ে জেনে নাও এখন কোনটা করব: ১) yt-comment (রিপ্লাই + নেক্সট আইডিয়া), ২) yt-retention (retention.py অডিট), নাকি ৩) yt-audit (চ্যানেলের সবচেয়ে বড় ১টি ফিক্স)।',
        children: [
          {
            id: 'growth_comment',
            title: '৯.১ কমেন্ট ট্রায়াজ (yt-comment)',
            sub: 'রিপ্লাই + পিন + নেক্সট ভিডিও আইডিয়া',
            role: 'Community Manager',
            tool: 'yt-comment',
            optional: true,
            x: 290, y: 752, w: 280, h: 56,
            points: [

        const sCY = sub.y + H / 2;
        const sx1 = R_BR_X + R_BR_W, sx2 = R_SUB_X, smx = (sx1 + sx2) / 2;
        svgHTML += `<path id="p-${sub.id}" class="link-path opt-line" d="M ${sx1} ${bCY} C ${smx} ${bCY}, ${smx} ${sCY}, ${sx2} ${sCY}" />`;
      });
    });

    linksSvg.innerHTML = svgHTML;

    function selectNode(id) {
      const data = nodeMap[id];
      if (!data) return;

      document.querySelectorAll('.t-node').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.link-path').forEach(p => p.classList.remove('active'));

      const el = document.getElementById('n-' + id);
      if (el) el.classList.add('active');

      if (data.parentId) {
        const pEl = document.getElementById('n-' + data.parentId);
        if (pEl) pEl.classList.add('active');
        const l1 = document.getElementById('p-' + data.parentId);
        const l2 = document.getElementById('p-' + id);
        if (l1) l1.classList.add('active');
        if (l2) l2.classList.add('active');
      } else {
        const l1 = document.getElementById('p-' + id);
        if (l1) l1.classList.add('active');
        data.childIds.forEach(cid => {
          const lc = document.getElementById('p-' + cid);
          if (lc) lc.classList.add('active');
        });
      }

      document.getElementById('inspector').innerHTML = `
        <div class="ins-head">
          <h3>${data.title}</h3>
          <div class="tags">
            <span class="tag ${data.optional ? 'opt' : ''}">${data.optional ? 'Optional (ঐচ্ছিক)' : 'Core (আবশ্যিক)'}</span>
            <span class="tag role">${data.role}</span>
            <span class="tag">${data.tool}</span>
          </div>
        </div>
        <ul>${data.points.map(p => `<li>${p}</li>`).join('')}</ul>
        <div class="prompt-box">
          <div class="prompt-top">
            <span class="prompt-label">মাস্টার প্রম্পট (সব লজিক ইন্টিগ্রেটেড • কপি করুন)</span>
            <button class="copy-btn" onclick="copyPrompt(this)">Copy</button>
          </div>
          <div class="prompt-text">${data.prompt}</div>
        </div>
      `;
    }

    function copyPrompt(btn) {
      const text = btn.closest('.prompt-box').querySelector('.prompt-text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
      });
    }

    // Pan & 2-Finger Pinch-Zoom Engine
    let scale = 0.5, panX = 0, panY = 0;
    const vp = document.getElementById('viewport');
    const stage = document.getElementById('stage');

    function applyTransform() {
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function resetCanvas() {
      const fitW = (vp.clientWidth - 16) / 1480;
      const fitH = (vp.clientHeight - 16) / 860;
      scale = Math.max(0.24, Math.min(0.68, +Math.min(fitW, fitH).toFixed(3)));
      panX = Math.round((vp.clientWidth - 1480 * scale) / 2);
      panY = Math.round((vp.clientHeight - 860 * scale) / 2);
      applyTransform();
    }

    let startDist = 0, startScale = 1;
    let isDragging = false, moved = false;
    let startX = 0, startY = 0, lastX = 0, lastY = 0;
    let tapTarget = null;

    vp.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isDragging = false;
        tapTarget = null;
        startDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        startScale = scale;
      } else if (e.touches.length === 1) {
        isDragging = true;
        moved = false;
        startX = lastX = e.touches[0].clientX;
        startY = lastY = e.touches[0].clientY;
        tapTarget = e.target.closest('.t-node[data-id]');
      }
    }, { passive: false });

    vp.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.min(2.2, Math.max(0.22, +(startScale * (dist / startDist)).toFixed(3)));
        applyTransform();
      } else if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        if (Math.hypot(e.touches[0].clientX - startX, e.touches[0].clientY - startY) > 8) {
          moved = true;
        }
        panX += dx;
        panY += dy;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        applyTransform();
      }
    }, { passive: false });

    vp.addEventListener('touchend', () => {
      if (!moved && tapTarget) {
        selectNode(tapTarget.dataset.id);
      }
      isDragging = false;
      tapTarget = null;
    });

    vp.addEventListener('mousedown', (e) => {
      isDragging = true;
      moved = false;
      startX = lastX = e.clientX;
      startY = lastY = e.clientY;
      tapTarget = e.target.closest('.t-node[data-id]');
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) moved = true;
      panX += e.clientX - lastX;
      panY += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => {
      if (isDragging && !moved && tapTarget) {
        selectNode(tapTarget.dataset.id);
      }
      isDragging = false;
      tapTarget = null;
    });
    vp.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale = Math.min(2.2, Math.max(0.22, +(scale + (e.deltaY < 0 ? 0.08 : -0.08)).toFixed(2)));
      applyTransform();
    }, { passive: false });

    resetCanvas();
    selectNode('sound');
  </script>
  <script src="./dependency-modal.js"></script>
</body>
</html>
