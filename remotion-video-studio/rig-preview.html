<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rev2D রিগ ও পশু-পাখি অ্যানিমেশন প্রিভিউ</title>
  <style>
    @font-face { font-family: 'HindSiliguriFixed'; src: url('./fonts/HindSiliguriFixed-Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'HindSiliguriFixed'; src: url('./fonts/HindSiliguriFixed-SemiBold.ttf') format('truetype'); font-weight: 600; }
    @font-face { font-family: 'HindSiliguriFixed'; src: url('./fonts/HindSiliguriFixed-Bold.ttf') format('truetype'); font-weight: 700; }
    :root {
      --bg: #0b0f14;
      --panel: #131a23;
      --border: rgba(255,255,255,0.1);
      --text: #eef3f8;
      --muted: #8ea0b5;
      --accent: #4cc9f0;
      --gold: #f5b942;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'HindSiliguriFixed', system-ui, sans-serif;
      padding: 16px;
      min-height: 100vh;
    }
    .top {
      max-width: 1120px;
      margin: 0 auto 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .top h1 { font-size: 1.28rem; font-weight: 700; }
    .top p { font-size: 0.84rem; color: var(--muted); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: #1d2735;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.primary { background: var(--accent); color: #061824; border-color: transparent; }
    .section { max-width: 1120px; margin: 0 auto 24px; }
    .section-title { font-size: 1.02rem; font-weight: 700; margin-bottom: 10px; color: var(--gold); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .media {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #090d14;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media video, .media img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 7px; }
    .card-body h3 { font-size: 0.96rem; font-weight: 700; }
    .card-body p { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: #1b2432;
      color: #bfe6ff;
      border: 1px solid rgba(76,201,240,0.28);
    }
    .chip.eye { color: #fde68a; border-color: rgba(245,185,66,0.35); }
    .chip.ok { color: #86efac; border-color: rgba(34,197,94,0.35); }
    .empty {
      padding: 18px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🦴 Rev2D রিগিং, পশু-পাখি ও লিপ-সিঙ্ক স্টুডিও</h1>
      <p>মানুষ, চতুষ্পদ প্রাণী, পাখি এবং মুখছাড়া Eye-Only আর্কেটাইপ + রেন্ডারকৃত MP4 প্রিভিউ</p>
    </div>
    <div class="controls">
      <a class="btn" href="./video-workflow-mindmap.html">← মাইন্ড-ম্যাপ</a>
      <a class="btn" href="./style-preview.html">🎬 ১০ স্টাইল প্রিভিউ</a>
      <button class="btn primary" id="refreshBtn">↻ রিফ্রেশ</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎬 রেন্ডারকৃত টেস্ট ও প্রিভিউ ভিডিও (MP4)</div>
    <div id="videosGrid" class="grid"></div>
  </div>

  <div class="section">
    <div class="section-title">🧩 ৪টি স্ট্যান্ডার্ড অ্যানাটমি রিগ আর্কেটাইপ (Biped, Quadruped, Avian, Eye-Only)</div>
    <div id="archetypesGrid" class="grid"></div>
  </div>

  <script>
    async function loadRigs() {
      const videosGrid = document.getElementById('videosGrid');
      const archGrid = document.getElementById('archetypesGrid');
      try {
        const res = await fetch('./api/rigs');
        const data = await res.json();

        if (!data.videos || data.videos.length === 0) {
          videosGrid.innerHTML = '<div class="empty">এখনো কোনো Rev2D MP4 রেন্ডার হয়নি। ধাপ ৫-এ টেস্ট রান দিলে এখানে ভিডিও দেখা যাবে।</div>';
        } else {
          videosGrid.innerHTML = data.videos.map(v => `
            <div class="card">
              <div class="media">
                <video src="${v.url}" ${v.poster ? `poster="${v.poster}"` : ''} controls loop playsinline preload="metadata"></video>
              </div>
              <div class="card-body">
                <h3>${v.file}</h3>
                <div class="chips">
                  <span class="chip ok">${v.duration ? v.duration + 's' : ''} · ${v.fps}fps</span>
                  <span class="chip">${v.sizeKB} KB</span>
                  ${v.hasAudio ? '<span class="chip ok">🔊 Audio + LipSync</span>' : ''}
                  ${(v.layers || []).map(l => `<span class="chip">${l}</span>`).join('')}
                </div>
                <p>মডেল: ${v.modelName}</p>
                <a class="btn" href="${v.url}" download="${v.file}">⬇ MP4 ডাউনলোড</a>
              </div>
            </div>
          `).join('');
        }

        archGrid.innerHTML = (data.archetypes || []).map(a => `
          <div class="card">
            <div class="media">
              ${a.previewPng ? `<img src="${a.previewPng}" alt="${a.name}" />` : '<span>No preview</span>'}
            </div>
            <div class="card-body">
              <h3>${a.name}</h3>
              <div class="chips">
                <span class="chip">${a.bones} Bones</span>
                <span class="chip">${a.ik} IK</span>
                <span class="chip">${a.physics} Physics</span>
                ${a.hasMouth ? '<span class="chip ok">MouthOpen LipSync</span>' : '<span class="chip eye">👁 Eye-Only</span>'}
              </div>
              <p>${a.description}</p>
              <div class="chips">${a.animations.map(an => `<span class="chip">${an}</span>`).join('')}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        videosGrid.innerHTML = `<div class="empty">সার্ভারের সাথে সংযোগ ব্যর্থ: ${e.message}</div>`;
      }
    }
    document.getElementById('refreshBtn').addEventListener('click', loadRigs);
    loadRigs();
  </script>
</body>
</html>
