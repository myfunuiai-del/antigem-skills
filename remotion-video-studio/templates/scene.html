<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 720px;
      height: 720px;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@19';
    import { createRoot } from 'https://esm.sh/react-dom@19/client';

    const lerp = (a, b, t) => a + (b - a) * Math.min(1, Math.max(0, t));

    function Scene({ frame }) {
      const progress = Math.min(1, frame / 30);
      const scale = lerp(0.5, 1, progress);
      const opacity = lerp(0, 1, frame / 15);
      const pulse = 1 + 0.04 * Math.sin((frame / 30) * Math.PI * 2);

      return React.createElement(
        'div',
        {
          style: {
            width: '100%',
            height: '100%',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            background: 'radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 100%)',
          },
        },
        React.createElement(
          'svg',
          {
            width: 220,
            height: 220,
            viewBox: '0 0 240 240',
            style: {
              transform: `scale(${scale * pulse})`,
              opacity,
              filter: 'drop-shadow(0 20px 30px rgba(59,130,246,0.4))',
            },
          },
          React.createElement('circle', { cx: 120, cy: 120, r: 90, fill: '#3b82f6' }),
          React.createElement('polygon', { points: '98,82 162,120 98,158', fill: '#ffffff' })
        ),
        React.createElement(
          'div',
          {
            style: {
              marginTop: 28,
              color: '#f8fafc',
              fontSize: 38,
              fontWeight: 700,
              opacity,
            },
          },
          'Remotion Video Studio'
        )
      );
    }

    const root = createRoot(document.getElementById('root'));
    window.setFrame = (f) => root.render(React.createElement(Scene, { frame: f }));
    window.setFrame(0);
  </script>
</body>
</html>
