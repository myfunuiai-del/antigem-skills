<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remotion Studio Live System Audit & Auto-Fix</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-sub: #1e293b;
      --accent: #38bdf8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-rose: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      line-height: 1.6;
      padding: 16px 10px;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .score-badge.warn {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: var(--accent-rose);
    }
    .nav-links {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .audit-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .audit-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    @media (max-width: 600px) {
      .audit-row {
        grid-template-columns: 24px 1fr;
      }
      .action-col {
        grid-column: span 2;
        display: flex;
        justify-content: flex-end;
        margin-top: 6px;
      }
    }
    .status-icon {
      font-size: 20px;
      line-height: 1;
    }
    .row-info h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      color: #e2e8f0;
    }
    .row-info p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .btn-fix {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.3);
      transition: opacity 0.2s;
    }
    .btn-fix:hover { opacity: 0.9; }
    .badge-ok {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .btn-recheck {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      font-size: 13px;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>🛡️ লাইভ সিস্টেম অডিট ও অটো-ফিক্স</h1>
        <p style="font-size: 12px; color: var(--muted);">টারমাক্স ব্যাকগ্রাউন্ড রিয়েল-টাইম চেক এবং অটোমেটিক গিটহাব রিপেয়ার</p>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span class="score-badge" id="overallBadge">🔄 চেকিং হচ্ছে...</span>
        <button class="btn-recheck" id="btnRecheck">🔄 Re-Check</button>
        <div class="nav-links">
          <a href="/video-workflow-mindmap.html" class="btn">🗺️ Mindmap</a>
          <a href="/modules-preview.html" class="btn">✨ মোশন লজিক</a>
        </div>
      </div>
    </header>

    <div class="audit-card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
        <span style="font-size: 14px; font-weight: 600; color: var(--accent);">কোর ডিপেন্ডেন্সি ও আর্কিটেকচার হেলথ</span>
        <span style="font-size: 11px; color: var(--muted);" id="lastCheckTime">Last checked: Just now</span>
      </div>
      <div id="auditList" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Dynamic audit rows -->
      </div>
    </div>
  </div>

  <script>
    const auditList = document.getElementById('auditList');
    const overallBadge = document.getElementById('overallBadge');
    const lastCheckTime = document.getElementById('lastCheckTime');
    const btnRecheck = document.getElementById('btnRecheck');

    async function runAudit() {
      overallBadge.className = 'score-badge';
      overallBadge.textContent = '🔄 চেকিং হচ্ছে...';
      auditList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted);">অডিট চলছে, অনুগ্রহ করে অপেক্ষা করুন...</div>';

      try {
        const res = await fetch('/api/audit');
        const data = await res.json();
        renderItems(data);
      } catch (err) {
        auditList.innerHTML = `<div style="padding: 20px; color: #f43f5e; text-align: center;">অডিট সার্ভার সংযোগে সমস্যা: ${err.message}</div>`;
      }
    }

    function renderItems(data) {
      lastCheckTime.textContent = 'Last checked: ' + new Date().toLocaleTimeString();
      if (data.ok) {
        overallBadge.className = 'score-badge';
        overallBadge.textContent = '✓ 100% PRODUCTION READY';
      } else {
        overallBadge.className = 'score-badge warn';
        overallBadge.textContent = '⚠️ সমস্যা পাওয়া গেছে (Fix Needed)';
      }

      auditList.innerHTML = data.items.map(item => `
        <div class="audit-row">
          <div class="status-icon">${item.ok ? '✅' : '❌'}</div>
          <div class="row-info">
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
          </div>
          <div class="action-col">
            ${item.ok 
              ? `<span class="badge-ok">RESOLVED</span>` 
              : `<button class="btn-fix" onclick="triggerFix('${item.fixId}', this)">🛠️ Fix Now</button>`
            }
          </div>
        </div>
      `).join('');
    }

    window.triggerFix = async function(fixId, btn) {
      btn.disabled = true;
      btn.textContent = 'ফিক্স হচ্ছে...';
      try {
        const res = await fetch('/api/audit-fix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fixId })
        });
        const result = await res.json();
        if (result.ok) {
          btn.textContent = '✓ ফিক্সড!';
          setTimeout(runAudit, 800);
        } else {
          alert('ফিক্স ব্যর্থ: ' + (result.error || 'Unknown'));
          btn.disabled = false;
          btn.textContent = '🛠️ Fix Now';
        }
      } catch (err) {
        alert('ফিক্স রিকোয়েস্ট এরর: ' + err.message);
        btn.disabled = false;
        btn.textContent = '🛠️ Fix Now';
      }
    };

    btnRecheck.addEventListener('click', runAudit);
    runAudit();
  </script>
</body>
</html>
